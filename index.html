
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Holiday Homes</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      color: #333;
      background: #faf9f6;
    }
    header {
      padding: 28px;
      text-align: center;
      letter-spacing: 3px;
    }

      text-align: center;

    a { color: inherit; }

</head>
<body>
  <header>OUR HOLIDAY HOMES</header>
  <main>
    <div class="hero">
      <div>
        <h1>A place to feel at home</h1>
        <p>Discover beautiful holiday accommodation in Portugal.</p>
      </div>
    </div>
    <section>
      <h2>Our Properties</h2>
      <p>Discover our collection of holiday homes.</p>
    </section>
    <section>
      <h2>Contact Us</h2>
      <p>We look forward to welcoming you.</p>
    </section>
  </main>

</html>
